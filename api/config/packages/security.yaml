security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        main:
            lazy: true
            provider: users
            entry_point: App\Security\AuthHandler
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\AuthHandler
                failure_handler: App\Security\AuthHandler
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/api/(login|logout|register|demo|me)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/shared/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
